<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale = 1.0">
        <title>Encabezado de pedidos</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <div class="container">
            <header class="header">
            <h1>Formulario para Pedidos</h1>
            </header>

            <main class="form-container">
                <form id="clienteForm">
                    <div class="form-group">
                        <label for="codCliente">codCliente:</label>
                        <input type="text" id="codCliente" name="codCliente" required>
                    </div>

                    <div class="form-group">
                        <label for="nroPedido">Nro pedido:</label>
                        <input type="text" id="nroPedido" name="nroPedido" required>
                    </div>

                    <div class="form-group">
                        <label for="condiciones">Condiciones de pago:</label>
                        <select id="condiciones" name="condiciones" required></select>
                    </div>

                    <div class="form-group">
                        <label for="moneda">Moneda</label>
                        <input type="text" id="moneda" name="moneda" required>
                    </div>

                    <div class="form-group">
                        <label for="plazoEntrega">Plazo de entrega:</label>
                        <input type="date" id="plazoEntrega" name="plazoEntrega" required>
                    </div>

                    <div class="form-group">
                        <label for="neto">Total neto del comprobante:</label>
                        <input type="number" id="neto" name="neto" value="0" required>
                    </div>

                    <button type="submit" class="btn-enviar">ENVIAR</button>
                </form>
            </main>

            <footer class="footer">
                <p>Pie del formulario</p>
            </footer>
        </div>

        <script src="script.js"></script>
    </body>    
</html>
