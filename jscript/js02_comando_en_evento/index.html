<!DOCTYPE html>
<head>
    <title>Comandos con eventos</title>
    <style>
        body {
            font-family: 'Arial', 'sans-serif';
            background-color: blue;
            color: yellow;
        }

        button {
            background-color: black;
            color: white
        }

        button:hover {
            background-color: black;
            color: white
        }
    </style>
</head>

<body>
    <h1>Comando en evento</h1>
    <button onclick="alert('Este mensaje es una alerta de que si no estudias vas a desaprobar');"> Click aquí para ejecutar un alert</button>
    <button onclick="document.write('Esta escritura pisa lo anterior (pero igual vas a desaprobar)')">Click aquí para ejecutar un document.write()</button>
</body>
</html>
