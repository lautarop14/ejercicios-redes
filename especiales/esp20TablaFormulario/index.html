<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedidos</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="contenedor-global">
        <div class="header">
            <h2>Pedidos</h2>
        </div>
        
        <div class="acciones">
            <button id="btnCargar">Cargar datos</button>
            <button id="btnVaciar">Vaciar datos</button>
            <button id="btnForm">Cargar Form</button>
        </div>

        <table id="tablaPedidos">
            <thead>
                <tr>
                    <th>CodCliente</th>
                    <th>Nro Pedido</th>
                    <th>Plazo de Entrega</th>
                    <th>Condiciones de pago</th>
                    <th>Moneda</th>
                    <th>Total Neto del Comprobante</th>
                </tr>
            </thead>
            <tbody>
                <!-- Filas dinámicas -->
            </tbody>
            <tfoot>
                <tr><td colspan="6">Pie</td></tr>
            </tfoot>
        </table>
    </div>

    <!-- Modal con iframe -->
    <div class="modal" id="modalForm">
        <div class="modal-contenido">
            <div class="modal-header">
                <span>Formulario para Pedidos</span>
                <span class="close-btn" id="cerrarModal">&times;</span>
            </div>
            <div class="modal-body">
                <iframe src="../esp05FormVariableArregloDeObjetos/index.html"></iframe>
            </div>
            <div class="modal-footer">Pie del formulario</div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
