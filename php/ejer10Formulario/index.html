<!DOCTYPE html>
<html lang="es">
<head>

    <title>Formulario simple</title>
</head>
<body>
    <h1>Formulario</h1>

    <!-- Al enviar, llama a respuesta.php usando método POST -->

        <input type="text" name="nombre"><br><br>

        <label>Apellido:</label>

        <input type="submit" value="Enviar">
    </form>
</body>
</html>
